{% extends "base.html" %}

{% block title %}Editar Curso - Admin{% endblock %}

{% block content %}
<div class="card">
    <h1>Editar Curso: {{ curso.nome }}</h1>
    
    <form method="POST">
        <div class="form-group">
            <label for="nome">Nome do Curso:</label>
            <input type="text" id="nome" name="nome" value="{{ curso.nome }}" required>
        </div>
        
        <div class="form-group">
            <label for="descricao">Descricao:</label>
            <textarea id="descricao" name="descricao" rows="4" required>{{ curso.descricao }}</textarea>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="duracao_meses">Duracao (meses):</label>
                <input type="number" id="duracao_meses" name="duracao_meses" min="1" value="{{ curso.duracao_meses }}" required>
            </div>
            
            <div class="form-group">
                <label for="valor">Valor (R$):</label>
                <input type="number" id="valor" name="valor" step="0.01" min="0" value="{{ curso.valor }}" required>
            </div>
        </div>
        
        <div class="form-group">
            <label for="ativo">
                <input type="checkbox" id="ativo" name="ativo" {% if curso.ativo %}checked{% endif %}>
                Curso Ativo
            </label>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button type="submit">Atualizar Curso</button>
            <a href="/admin/cursos" style="text-decoration: none;"><button type="button" class="secondary">Cancelar</button></a>
        </div>
    </form>
</div>
{% endblock %}
