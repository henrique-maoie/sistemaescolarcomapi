{% extends "base.html" %}

{% block title %}Editar Funcionario - Admin{% endblock %}

{% block content %}
<div class="card">
    <h1>Editar Funcionario: {{ funcionario.nome }}</h1>
    
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" value="{{ funcionario.nome }}" required>
            </div>
            
            <div class="form-group">
                <label for="cargo">Cargo:</label>
                <input type="text" id="cargo" name="cargo" value="{{ funcionario.cargo }}" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="setor_id">Setor:</label>
                <select id="setor_id" name="setor_id">
                    <option value="">Selecione um setor</option>
                    {% for setor in setores %}
                        <option value="{{ setor.id }}" {% if funcionario.setor_id == setor.id %}selected{% endif %}>
                            {{ setor.nome }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="salario">Salario (R$):</label>
                <input type="number" id="salario" name="salario" step="0.01" min="0" value="{{ funcionario.salario or 0 }}">
            </div>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button type="submit">Atualizar Funcionario</button>
            <a href="/admin/funcionarios" style="text-decoration: none;"><button type="button" class="secondary">Cancelar</button></a>
        </div>
    </form>
</div>
{% endblock %}
