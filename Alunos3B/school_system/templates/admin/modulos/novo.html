{% extends "base.html" %}

{% block title %}Novo Modulo - Admin{% endblock %}

{% block content %}
<div class="card">
    <h1>Criar Novo Modulo</h1>
    
    <form method="POST">
        <div class="form-group">
            <label for="curso_id">Curso:</label>
            <select id="curso_id" name="curso_id" required>
                <option value="">Selecione um curso</option>
                {% for curso in cursos %}
                    <option value="{{ curso.id }}">{{ curso.nome }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="nome">Nome do Modulo:</label>
            <input type="text" id="nome" name="nome" required>
        </div>
        
        <div class="form-group">
            <label for="descricao">Descricao:</label>
            <textarea id="descricao" name="descricao" rows="3"></textarea>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="carga_horaria">Carga Horaria:</label>
                <input type="number" id="carga_horaria" name="carga_horaria" min="1" required>
            </div>
            
            <div class="form-group">
                <label for="ordem">Ordem:</label>
                <input type="number" id="ordem" name="ordem" min="1" required>
            </div>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button type="submit">Criar Modulo</button>
            <a href="/admin/modulos" style="text-decoration: none;"><button type="button" class="secondary">Cancelar</button></a>
        </div>
    </form>
</div>
{% endblock %}
