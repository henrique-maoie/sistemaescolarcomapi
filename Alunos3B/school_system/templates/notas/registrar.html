{% extends "base.html" %}

{% block title %}Registrar Notas - Sistema de Gestão Escolar{% endblock %}

{% block content %}
<div class="card">
    <h1>Registrar Notas - {{ turma.nome }}</h1>
    
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label for="matricula_id">Aluno:</label>
                <select id="matricula_id" name="matricula_id" required>
                    <option value="">Selecione um aluno</option>
                    {% for aluno in alunos %}
                        <option value="{{ aluno.matricula_id }}">{{ aluno.nome }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="modulo_id">Módulo:</label>
                <select id="modulo_id" name="modulo_id" required>
                    <option value="">Selecione um módulo</option>
                    {% for modulo in modulos %}
                        <option value="{{ modulo.id }}">{{ modulo.nome }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="primeira_nota">1ª Nota (0-10):</label>
                <input type="number" id="primeira_nota" name="primeira_nota" min="0" max="10" step="0.1" required>
            </div>
            
            <div class="form-group">
                <label for="segunda_nota">2ª Nota (0-10):</label>
                <input type="number" id="segunda_nota" name="segunda_nota" min="0" max="10" step="0.1" required>
            </div>
        </div>
        
        <div class="form-group">
            <label for="terceira_nota">3ª Nota (0-10):</label>
            <input type="number" id="terceira_nota" name="terceira_nota" min="0" max="10" step="0.1" required>
        </div>
        
        <div style="margin-top: 20px;">
            <button type="submit">Salvar Notas</button>
            <a href="/dashboard" style="text-decoration: none;"><button type="button" class="secondary">Cancelar</button></a>
        </div>
    </form>
</div>
{% endblock %}
