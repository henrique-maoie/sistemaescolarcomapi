{% extends "base.html" %}

{% block title %}Nova Turma - Sistema de Gestão Escolar{% endblock %}

{% block content %}
<div class="card">
    <h1>Criar Nova Turma</h1>
    
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label for="codigo">Código da Turma:</label>
                <input type="text" id="codigo" name="codigo" required>
            </div>
            
            <div class="form-group">
                <label for="nome">Nome da Turma:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="curso_id">Curso:</label>
                <select id="curso_id" name="curso_id" required>
                    <option value="">Selecione um curso</option>
                    {% for curso in cursos %}
                        <option value="{{ curso.id }}">{{ curso.nome }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="professor_id">Professor:</label>
                <select id="professor_id" name="professor_id" required>
                    <option value="">Selecione um professor</option>
                    {% for professor in professores %}
                        <option value="{{ professor.id }}">{{ professor.nome }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="data_inicio">Data de Início:</label>
                <input type="date" id="data_inicio" name="data_inicio" required>
            </div>
            
            <div class="form-group">
                <label for="data_fim">Data de Término:</label>
                <input type="date" id="data_fim" name="data_fim" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="horario">Horário:</label>
                <input type="text" id="horario" name="horario" placeholder="Ex: 19:00 - 21:00" required>
            </div>
            
            <div class="form-group">
                <label for="sala">Sala:</label>
                <input type="text" id="sala" name="sala" required>
            </div>
        </div>
        
        <div class="form-group">
            <label for="capacidade">Capacidade (máximo de alunos):</label>
            <input type="number" id="capacidade" name="capacidade" required>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button type="submit">Criar Turma</button>
            <a href="/turmas" style="text-decoration: none;"><button type="button" class="secondary">Cancelar</button></a>
        </div>
    </form>
</div>
{% endblock %}
